# Merge these directives into the HTTPS server block used by noadua.com.
# This assumes Next.js is running on 127.0.0.1:3000. Change the port if your PM2 app uses another port.
server {
    listen 443 ssl;
    server_name noadua.com www.noadua.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Keep existing SSL certificate directives from your current GoDaddy config.
}
